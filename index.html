<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Everyday get a random movie from the list of 1001 movies to watch before you die.">
	<meta name="keywords" content="movies,1001,cinema,watch,free">
	<meta name="author" content="rooyca">
	<title>Random Movie of the Day - 1001 Movies</title>
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="favicon.svg">
</head>
<body>
	<figure class="movie">
	  <div class="movie__hero">
	    <img class="movie__img" alt="Movie Poster" src="600x900.svg" data-src="600x900.svg">
	  </div>
	  <div class="movie__content">
	    <div class="movie__title">
	      <h1 class="heading__primary">Weekend</h1>
	      <h2 class="heading__secondary">David McNeill</h2>
	    </div>
	    <p class="movie__description">Romp through a world full of Rube Goldberg devices, then to a jungle trek, then to paradise...</p>
	    <div class="movie__details">
	      <p class="movie__detail year">📅 1967</p>
	      <p class="movie__detail tag">🏷️ ##Movie</p>
	      <p class="movie__detail length">🕒 0h 19m</p>
	    </div>
	  </div>
	  <div class="movie__date">Fri Jul 04 2025</div>
	</figure>
	<script src="index.js"></script>
</body>
</html>
