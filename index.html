<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Everyday get a random movie from the list of 1001 movies to watch before you die.">
	<meta name="keywords" content="movies,1001,cinema,watch,free">
	<meta name="author" content="rooyca">
	<title>Random Movie of the Day - 1001 Movies</title>
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="favicon.svg">
</head>
<body>
	<figure class="movie">
	  <div class="movie__hero">
	    <img class="movie__img" alt="Movie Poster" src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/v0giIi4bTILVhNhJajet3WWY3FA.jpg" data-src="600x900.svg">
	  </div>
	  <div class="movie__content">
	    <div class="movie__title">
	      <h1 class="heading__primary">Run Lola Run</h1>
	      <h2 class="heading__secondary">Tom Tykwer</h2>
	    </div>
	    <p class="movie__description">Lola receives a phone call from her boyfriend Manni. He lost 100,000 DM in a subway train that belongs to a very bad guy. She has 20 minutes to raise this amount and meet Manni. Otherwise, he will rob a store to get the money. Three different alternatives may happen depending on some minor event along Lola's run.</p>
	    <div class="movie__details">
	      <p class="movie__detail year">📅 1998</p>
	      <p class="movie__detail tag">🏷️ #Action</p>
	      <p class="movie__detail length">🕒 1h 21m</p>
	    </div>
	  </div>
	  <div class="movie__date">Mon Nov 02 2026</div>
	</figure>
	<script src="index.js"></script>
</body>
</html>
