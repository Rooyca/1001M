	    <p class="movie__description">In his award-winning film Lucía, Humberto Solás interpreted the theme of Cuba’s hundred years' struggle in an entirely novel way to create an epic in three separate episodes, each centred around a woman called Lucía and each unfolding in a different period of Cuban history, corresponding to the three stages of colonialism (1895), neocolonialism (1930) and socialist revolution (1968). The three episodes also present us with "Lucías" of different social classes. Solás described his film in this way: "The woman's role always lays bare the contradictions of a period and makes them explicit: Lucía is not a film about women, it's a film about society."</p>
