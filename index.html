<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Everyday get a random movie from the list of 1001 movies to watch before you die.">
	<meta name="keywords" content="movies,1001,cinema,watch,free">
	<meta name="author" content="rooyca">
	<title>Random Movie of the Day - 1001 Movies</title>
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="favicon.svg">
</head>
<body>
	<figure class="movie">
	  <div class="movie__hero">
	    <img class="movie__img" alt="Movie Poster" src="https://image.tmdb.org/t/p/w600_and_h900_bestv2/fNOH9f1aA7XRTzl1sAOx9iF553Q.jpg" data-src="600x900.svg">
	  </div>
	  <div class="movie__content">
	    <div class="movie__title">
	      <h1 class="heading__primary">Back to the Future</h1>
	      <h2 class="heading__secondary">Robert Zemeckis</h2>
	    </div>
	    <p class="movie__description">Eighties teenager Marty McFly is accidentally sent back in time to 1955, inadvertently disrupting his parents' first meeting and attracting his mother's romantic interest. Marty must repair the damage to history by rekindling his parents' romance and - with the help of his eccentric inventor friend Doc Brown - return to 1985.</p>
	    <div class="movie__details">
	      <p class="movie__detail year">📅 1985</p>
	      <p class="movie__detail tag">🏷️ #Adventure</p>
	      <p class="movie__detail length">🕒 2h 56m</p>
	    </div>
	  </div>
	  <div class="movie__date">Wed Apr 01 2026</div>
	</figure>
	<script src="index.js"></script>
</body>
</html>
