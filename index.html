	    <p class="movie__description">Passenger tells the story of arriving in a new country to live. Sitting in the back of a taxi, you gradually piece together your story, abstracted and dreamlike, as you progress into the quiet shock of a new world. Your taxi driver, himself a migrant to Australia, navigates the new terrain with you, and acts as your guide while revealing small glimpses of his own story. This 360-degree, stop-motion VR film recreates and investigates the geographic and visual dislocation of arriving somewhere unfamiliar: the beginnings of finding a new home in a foreign land.</p>
